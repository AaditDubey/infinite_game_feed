[project]
name = "puzzle-pipeline"
version = "0.1.0"
description = "Generates and verifies the app's puzzle packs."
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor", "out"]

[dependency-groups]
dev = [
    "cmake>=4.4.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
